name: Build BodyDream Coach 4.2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check JavaScript syntax
        run: |
          node --check app/src/main/assets/data.js
          node --check app/src/main/assets/app.js

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleDebug --stacktrace 2>&1 | tee build-output.txt

      - name: Check APK and checksum
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          (cd app/build/outputs/apk/debug && sha256sum app-debug.apk > APK-SHA256.txt)

      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: BodyDream-Coach-4.2-Redmi-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/APK-SHA256.txt
          if-no-files-found: error

      - name: Build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BodyDream-build-error-log
          path: build-output.txt
          if-no-files-found: ignore
